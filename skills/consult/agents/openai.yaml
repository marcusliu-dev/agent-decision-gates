interface:
  display_name: "Consult"
  short_description: "Independent challenge gate for risky decisions"
  default_prompt: >-
    Use $consult to review a high-stakes decision with a primary pass and an
    independent challenge pass before acting. If runtime reports `agent thread
    limit reached`, attempt one bounded cleanup of visible completed
    consult-owned current-thread agents and retry once before inline fallback.

policy:
  allow_implicit_invocation: false
