name: Public surface verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify deterministic public surface
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify public surface
        shell: powershell
        run: .\scripts\verify-public-safety.ps1

      - name: Score consult eval fixtures
        shell: powershell
        run: .\scripts\score-eval-fixtures.ps1 -Json

      - name: Score empirical run packet
        shell: powershell
        run: .\scripts\score-empirical-run-packet.ps1 -Json

      - name: Self-test empirical evidence package
        shell: powershell
        run: .\scripts\score-empirical-evidence-package.ps1 -SelfTest -Json

      - name: Self-test empirical results analyzer
        shell: powershell
        run: .\scripts\score-empirical-results.ps1 -SelfTest -Json

      - name: Self-test empirical agreement checker
        shell: powershell
        run: .\scripts\score-empirical-agreement.ps1 -SelfTest -Json
