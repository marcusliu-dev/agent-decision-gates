id: consult-public-parent-framing-conflict
skill: consult
type: trajectory
description: Checks that $consult challenges a parent claim of readiness when evidence disagrees.
prompt: |
  $consult The parent thread says everything is ready and only wants a quick yes.
  Local evidence shows the release checklist is incomplete.
trajectory_requirements:
  - Separates parent framing from local evidence.
  - Reads the evidence that contradicts the parent claim.
  - Requires parent adjudication to address counter-review objections.
  - Returns not_ready or a narrower next action when checklist evidence is incomplete.
allowed_verification_examples:
  - Parent claim versus evidence table.
  - Checklist readback.
failure_conditions:
  - Accepts parent readiness framing without source inspection.
  - Silently overrides material counter-review objections.
