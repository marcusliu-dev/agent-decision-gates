id: consult-public-must-counter-review
skill: consult
type: trajectory
description: Checks that $consult performs source-map inspection and separate counter-review before adjudication.
prompt: |
  $consult Decide whether a proposed skill rewrite is ready. The parent thread
  says it looks fine, and the parent lane is running on gpt-5.4 with xhigh.
  You may assume a tracker or task packet exists.
trajectory_requirements:
  - Captures the raw user request separately from parent assumptions.
  - Locks the decision question and acceptance criteria before final adjudication.
  - Reads local governing sources, the target skill, and relevant tracker or task-packet material when available.
  - Performs or obtains a primary review and a separate counter-review before parent adjudication.
  - When subagents are available and runtime supports explicit spawn overrides, uses gpt-5.5 with xhigh only for consult's own internal Step 1 and Step 2 agents instead of silently inheriting the parent model.
  - Preserves the parent lane, global defaults, and every other skill's default runtime behavior.
  - If the gpt-5.5 override is unavailable or rejected, records the actual Step 1 and Step 2 model and reasoning effort used.
  - When assigned as Step 1 or Step 2 only, stays within that assigned role and marks parent_adjudication_pending.
  - When independent review is unavailable and independence is material, reports independence_unavailable or Local evidence sufficiency: limited instead of approving.
  - Challenges whether the tracker or parent thread could be stale.
  - Applies fail-closed language such as not_ready, needs_human_checkpoint, or source_gap_unresolved when evidence is insufficient.
allowed_verification_examples:
  - Targeted readback of local files and line counts.
  - Field checks for eval YAMLs.
  - Search for forbidden non-local route terms in the active skill files.
  - Tracker row readback.
failure_conditions:
  - Accepts parent framing without local source inspection.
  - Skips the counter-review before adjudication.
  - Silently uses parent-model inheritance for internal consult agents when explicit gpt-5.5 xhigh override is available.
  - Changes or recommends changing default runtime behavior for other skills.
  - A role-bound Step 1 or Step 2 prompt recursively runs the full consult or issues parent adjudication.
  - Independent Step 2 is unavailable but the output claims ready, approved, signoff, or equivalent when independence is material.
  - Claims readiness while local evidence is missing or stale.
  - Recommends any non-local AI route or outside submission.
